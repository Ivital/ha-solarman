name: Deye monitoring stage-1
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7' -r deploy/rakurs/standalone/requirements.txt
      - name: Python syntax validation
        run: python -m compileall -q custom_components/solarman
      - name: Validate deployment repair script syntax
        run: bash -n deploy/repair_config_permissions.sh
      - name: Validate Rakurs preflight script and proxy templates
        run: |
          bash -n deploy/rakurs/preflight.sh
          bash -n deploy/rakurs/activate_https.sh
          bash -n deploy/rakurs/diagnose_tls.sh
          bash -n deploy/rakurs/preflight_proxy_trust.sh
          bash -n deploy/rakurs/install_diagram.sh
          bash -n deploy/rakurs/audit_storage.sh
          bash -n deploy/rakurs/mysql_archive_preflight.sh
          bash -n deploy/rakurs/mysql_archive_apply_schema.sh
          bash -n deploy/rakurs/standalone/apply_auth_schema.sh
          bash deploy/rakurs/standalone/apply_auth_schema.sh --check
          bash -n deploy/rakurs/standalone/stage_standalone.sh
          bash deploy/rakurs/standalone/stage_standalone.sh --check
          bash -n deploy/rakurs/standalone/switch_rakurs_nginx.sh
          bash -n deploy/rakurs/standalone/retire_homeassistant.sh
          bash -n deploy/rakurs/standalone/migrate_rakurs.sh
          bash -n deploy/rakurs/standalone/remove_legacy_ha_now.sh
          python -m py_compile deploy/rakurs/standalone/nginx_rakurs_route_audit.py
          python -m unittest discover -s tests -p 'test_rakurs_nginx_route_audit.py' -v
          python -m py_compile deploy/rakurs/standalone/app.py
          python -m py_compile deploy/rakurs/standalone/auth.py
          python -m py_compile deploy/rakurs/standalone/bootstrap_admin.py
          python -m py_compile deploy/rakurs/standalone/provision_mysql_web_user.py
          bash deploy/rakurs/mysql_archive_apply_schema.sh --check
          python -m py_compile deploy/rakurs/mysql_archive_tls_diagnose.py
          sh -n deploy/rakurs/renewal-nginx-reload.sh
          python -m unittest discover -s tests -p 'test_rakurs_proxy.py' -v
      - name: Validate Docker Compose configuration
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
      - name: RAKURS dashboard YAML and zero-fabrication tests
        run: python -m unittest discover -s tests -p 'test_rakurs_dashboard.py' -v
      - name: RAKURS LAN archive schema and transport-policy tests
        run: python -m unittest discover -s tests -p 'test_rakurs_mysql_archive.py' -v
      - name: Rakurs standalone MySQL-only application tests
        run: |
          python -m unittest discover -s tests -p 'test_rakurs_standalone.py' -v
          node --check deploy/rakurs/standalone/static/app.js
      - name: Read-only integration tests
        run: python -m unittest discover -s tests -p 'test_deye*.py' -v
      - name: Home Assistant hassfest validation
        uses: home-assistant/actions/hassfest@master
