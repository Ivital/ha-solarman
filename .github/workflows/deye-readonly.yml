name: Deye monitoring stage-1
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Python syntax validation
        run: python -m compileall -q custom_components/solarman
      - name: Validate Docker Compose configuration
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
      - name: Read-only integration tests
        run: python -m unittest discover -s tests -p 'test_deye_readonly.py' -v
      - name: Home Assistant hassfest validation
        uses: home-assistant/actions/hassfest@master
