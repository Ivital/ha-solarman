name: Deye monitoring stage-1
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7' -r deploy/rakurs/standalone/requirements.txt
      - name: Python syntax validation
        run: python -m compileall -q custom_components/solarman
      - name: Validate deployment repair script syntax
        run: bash -n deploy/repair_config_permissions.sh
      - name: Validate Rakurs preflight script and proxy templates
        run: |
          bash -n deploy/rakurs/preflight.sh
          bash -n deploy/rakurs/activate_https.sh
          bash -n deploy/rakurs/diagnose_tls.sh
          bash -n deploy/rakurs/preflight_proxy_trust.sh
          bash -n deploy/rakurs/install_diagram.sh
          bash -n deploy/rakurs/audit_storage.sh
          bash -n deploy/rakurs/mysql_archive_preflight.sh
          bash -n deploy/rakurs/mysql_archive_apply_schema.sh
          bash -n deploy/rakurs/standalone/apply_auth_schema.sh
          bash deploy/rakurs/standalone/apply_auth_schema.sh --check
          bash -n deploy/rakurs/standalone/stage_standalone.sh
          bash -n deploy/rakurs/standalone/install_full_modbus_demo.sh
          bash -n deploy/rakurs/standalone/fix_demo_visibility.sh
          bash -n deploy/rakurs/standalone/repair_dashboard_assets.sh
          bash -n deploy/rakurs/standalone/deploy_deye_server_view.sh
          bash -n deploy/rakurs/standalone/deploy_primary_mysql_dashboard.sh
          bash -n deploy/rakurs/standalone/deploy_deye_history_and_dashboard.sh
          bash -n deploy/rakurs/standalone/audit_browser_delivery.sh
          bash -n deploy/rakurs/standalone/deploy_stable_dashboard.sh
          bash -n deploy/rakurs/standalone/deploy_clarity_ui.sh
          bash -n deploy/rakurs/standalone/deploy_events_ui.sh
          bash -n deploy/rakurs/standalone/audit_parallel_host_readonly.sh
          # Historical one-time installers are not valid acceptance checks
          # for the unified MySQL release. Test syntax only; current release
          # acceptance runs in deploy_parallel_ui.sh --check.
          bash -n deploy/rakurs/standalone/deploy_parallel_ui.sh
          bash -n deploy/rakurs/standalone/audit_site_full_readonly.sh
          bash -n deploy/rakurs/standalone/audit_unified_mysql_readonly.sh
          bash deploy/rakurs/standalone/deploy_parallel_ui.sh --check
          bash -n deploy/rakurs/standalone/deploy_full_modbus_archive.sh
          bash deploy/rakurs/standalone/deploy_full_modbus_archive.sh --check
          python deploy/rakurs/standalone/apply_modbus_fingerprints.py
          python deploy/rakurs/standalone/harden_mysql_grants.py
          python3 deploy/rakurs/standalone/seed_two_parallel_demo.py
          python3 -m py_compile deploy/rakurs/standalone/modbus_archive.py
          python -m py_compile deploy/rakurs/standalone/simulate_deye_once.py
          python deploy/rakurs/standalone/simulate_deye_once.py
          bash deploy/rakurs/standalone/stage_standalone.sh --check
          bash -n deploy/rakurs/standalone/switch_rakurs_nginx.sh
          bash -n deploy/rakurs/standalone/retire_homeassistant.sh
          bash -n deploy/rakurs/standalone/migrate_rakurs.sh
          bash -n deploy/rakurs/standalone/remove_legacy_ha_now.sh
          python -m py_compile deploy/rakurs/standalone/nginx_rakurs_route_audit.py
          python -m unittest discover -s tests -p 'test_rakurs_nginx_route_audit.py' -v
          python -m py_compile deploy/rakurs/standalone/app.py
          python -m py_compile deploy/rakurs/standalone/auth.py
          python -m py_compile deploy/rakurs/standalone/bootstrap_admin.py
          python -m py_compile deploy/rakurs/standalone/provision_mysql_web_user.py
          bash deploy/rakurs/mysql_archive_apply_schema.sh --check
          python -m py_compile deploy/rakurs/mysql_archive_tls_diagnose.py
          sh -n deploy/rakurs/renewal-nginx-reload.sh
          python -m unittest discover -s tests -p 'test_rakurs_proxy.py' -v
      - name: Validate Windows MySQL retirement script syntax (no execution)
        shell: pwsh
        run: |
          $tokens = $null
          $issues = $null
          foreach ($name in @(
            "retire_legacy_deye_windows.ps1",
            "install_polling_config_windows.ps1",
            "install_two_deye_history_windows.ps1"
          )) {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              ("deploy/rakurs/standalone/" + $name),
              [ref]$tokens, [ref]$issues
            ) | Out-Null
            if ($issues.Count -ne 0) {
              $issues | Out-String | Write-Error
              exit 1
            }
          }
      - name: Validate guarded two-Deye history in isolated MySQL 8
        run: bash tests/run_rakurs_history_mysql_integration.sh
      - name: Validate Docker Compose configuration
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
      - name: RAKURS dashboard YAML and zero-fabrication tests
        run: python -m unittest discover -s tests -p 'test_rakurs_dashboard.py' -v
      - name: RAKURS LAN archive schema and transport-policy tests
        run: python -m unittest discover -s tests -p 'test_rakurs_mysql_archive.py' -v
      - name: Rakurs standalone MySQL-only application tests
        run: |
          python -m unittest discover -s tests -p 'test_rakurs_standalone.py' -v
          python -m unittest discover -s tests -p 'test_rakurs_history_72h.py' -v
          python -m unittest discover -s tests -p 'test_rakurs_parallel.py' -v
          python -m unittest discover -s tests -p 'test_rakurs_modbus_full_archive.py' -v
          python -m unittest discover -s tests -p 'test_rakurs_modbus_wire.py' -v
          python -m unittest discover -s tests -p 'test_rakurs_security_upgrade.py' -v
          # Include newly added and future regression files in every CI run.
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check deploy/rakurs/standalone/static/app.js
          node tests/test_rakurs_ssr_guard.js
          node --check deploy/rakurs/standalone/static/app-clarity-20261124.js
          node --check deploy/rakurs/standalone/static/app-parallel-20261124.js
          node --check deploy/rakurs/standalone/static/app-parallel-archive-20261124.js
          node --check deploy/rakurs/standalone/static/app-parallel-twin-20261125.js
          node tests/test_rakurs_clarity_ui.js
      - name: Read-only integration tests
        run: python -m unittest discover -s tests -p 'test_deye*.py' -v
      - name: Home Assistant hassfest validation
        uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master verified 2026-11-25
