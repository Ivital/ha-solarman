name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
jobs:
  hassfest:
    name: with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    # A private-purpose fork is installed via Docker volume, not published in HACS.
    # HACS public-repository checks require topics, Issues and brand assets.
    if: github.repository == 'davidrapan/ha-solarman'
    name: with hacs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
