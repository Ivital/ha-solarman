            {%- endmacro %}
            **Модуль 3: діагностика**
            
            | Показник | Значення |
            |:--|--:|
            | Модуль 3: Тривога | {{ value('bms_3_alarm', '') }} |
            | Модуль 3: Помилка | {{ value('bms_3_fault', '') }} |
            | Модуль 3: Макс. напруга комірки | {{ value('bms_3_max_cell_voltage', 'В') }} |
            | Модуль 3: Мін. напруга комірки | {{ value('bms_3_min_cell_voltage', 'В') }} |
            | Модуль 3: Цикли | {{ value('bms_3_cycles', '') }} |
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Модуль BMS 4"
          icon: mdi:battery-outline
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            {% macro value(id,unit='') -%}
            {%- set raw=states('sensor.rakurs_' ~ id) -%}
            {{ raw ~ (' ' ~ unit if unit else '') if raw not in ['unknown','unavailable','none',''] else '—' }}
