            **Журнал аварій та відновлень** буде побудований із справжніх станів і подій Home Assistant після налаштування обладнання. Не створюємо синтетичних тривог і не позначаємо відсутні сенсори як поломку.
  - title: "Архів"
    path: archive
    icon: mdi:database
    show_icon_and_title: true
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Зберігання вимірювань"
          icon: mdi:database
        - type: markdown
          grid_options:
            columns: 24
          content: |-
            ### Оперативна база
            
            **Recorder Home Assistant · SQLite (за замовчуванням)**
            
            `/config/home-assistant_v2.db`
            
            На Debian: `/home/ivital/deye-monitoring-src/deploy/data/home-assistant_v2.db`
            
            **10 діб:** повна історія станів за стандартної конфігурації.
            
            **5 хвилин:** короткострокова статистика (протягом строку зберігання).
            
            **1 година:** довгострокова статистика сенсорів зі `state_class` — без автоматичного очищення.
            
            *Це типова схема Home Assistant; поточні налаштування перевіряються аудитом.*
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Довготривале зберігання"
          icon: mdi:archive-check
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            ### Архів усіх вимірів
            
            Для багаторічного збереження **кожного окремого вимірювання**, а не тільки погодинних агрегатів, підготуємо окрему архівну БД та механізм експорту з контрольованою схемою і резервними копіями.
            
            **Статус: архів повних вибірок ще не розгорнуто**. Рішення про окремий накопичувач прийматимемо після аудиту дискового простору й вимог до інтервалу опитування.
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            ### Резервне копіювання
            
            Потрібен щонайменше один **відокремлений носій/система**, а не лише той самий диск Debian. Зберігатимемо конфігурацію, історичну БД, каталог відповідності сенсорів і журнал змін.
            
            **Статус: зовнішнє резервування Rakurs ще не підтверджено.** Перевірка резервної копії відновленням є обов'язковою.
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Дискова безпека"
          icon: mdi:shield-check
        - type: markdown
          grid_options:
            columns: 24
          content: |-
            **Ніяких необмежених журналів у робочій БД.** Не вимикаємо автоочищення Recorder і не збільшуємо `purge_keep_days` без оцінки зростання бази та запасу місця для SQLite.
            
            Для перевірки на Debian: `bash deploy/rakurs/audit_storage.sh`. Скрипт нічого не змінює і не виводить паролів чи вмісту сенсорів.
  - title: "Система"
    path: system
    icon: mdi:cog-outline
    show_icon_and_title: true
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      - type: grid
        cards:
        - type: heading
          heading: "Стан інфраструктури"
          icon: mdi:server
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            ### RAKURS
            
            ✅ Home Assistant у Docker
            
            ✅ HTTPS та два доменні імені
            
            ✅ TCP-з'єднання до Teltonika
            
            ⌛ Modbus / RS485: протокол шлюзу потребує підтвердження
            
            ⌛ Дані Deye: ще не читаються
      - type: grid
        cards:
        - type: heading
          heading: "Безпека та доступ"
          icon: mdi:shield-check
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            ### Політика доступу
            
            **Тільки читання інвертора.** Команди запису й керування вимкнені.
            
            Адміністратор Home Assistant створений. **Перевірку MFA та індикатора захищеності в браузері потрібно завершити окремо.**
            
            Порт 8123 доступний лише з локального хоста Debian.
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Сумісність"
          icon: mdi:chip
        - type: markdown
          grid_options:
            columns: 24
          content: |-
            **Інвертор:** Deye, 3 фази, 2 MPPT.
            
            **Канал:** Teltonika → MikroTik VPN → Debian → Home Assistant.
            
            **Важливо:** TCP CONNECT не підтверджує Modbus TCP/RTU; Slave ID, параметри RS485 та реєстр Deye перевіримо перед опитуванням.
