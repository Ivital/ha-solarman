            ⏳ Teltonika TRB145 зараз працює з **ІТМ**, перенесення до **Deye заплановано**.
            
            ⏳ Протокол обміну, достовірність регістрів, останній успішний замір і частка втрачених опитувань — **ще не підтверджені**.
            
