# RAKURS | dashboard v4 | UI-managed custom dashboard only
# Not configuration.yaml. All sensor.rakurs_* IDs are placeholders until Deye is verified.
# 2026-11-24. Built-in Sections, Heading, Markdown, Picture and conditional history/statistics cards.
views:
  - title: "Огляд"
    path: overview
    icon: mdi:view-dashboard
    show_icon_and_title: true
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Оперативна інформація"
          icon: mdi:solar-power
        - type: markdown
          grid_options:
            columns: 12
          text_only: true
          content: |-
            # RAKURS
            **ЕНЕРГОМОНІТОРИНГ · DEYE**
            
            Показники інвертора, акумулятора, мережі та споживання в одному місці.
            
            **{{ now().strftime('%d.%m.%Y · %H:%M') }}** · Київ
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            ### Стан моніторингу
            
            {% set s=states('sensor.rakurs_inverter_status') %}
            {% if s not in ['unknown', 'unavailable', 'none', ''] %}
            **{{ s }}**
            {% else %}
            **Очікування телеметрії Deye**
            {% endif %}
            
            ✅ Home Assistant · HTTPS та авторизація
            
            ⌛ Modbus · ідентифікація протоколу шлюзу
            
            _До підтвердження регістрів показники не обчислюються._
      - type: grid
        cards:
        - type: heading
          heading: "Генерація та навантаження"
          icon: mdi:flash
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **☀️ Сонячна генерація**
            
            {% set value = states('sensor.rakurs_pv_power') %}
            ## {{ (value ~ ' кВт') if value not in ['unknown', 'unavailable', 'none', ''] else '—' }}
            
            Поточна потужність PV
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **🏠 Навантаження**
            
            {% set value = states('sensor.rakurs_load_power') %}
            ## {{ (value ~ ' кВт') if value not in ['unknown', 'unavailable', 'none', ''] else '—' }}
            
            Потужність споживачів
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **☀️ Генерація за добу**
            
            {% set value = states('sensor.rakurs_pv_energy_today') %}
            ## {{ (value ~ ' кВт·год') if value not in ['unknown', 'unavailable', 'none', ''] else '—' }}
            
            Добова енергія PV
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **🏠 Споживання за добу**
            
            {% set value = states('sensor.rakurs_load_energy_today') %}
            ## {{ (value ~ ' кВт·год') if value not in ['unknown', 'unavailable', 'none', ''] else '—' }}
            
            Добова енергія навантаження
      - type: grid
        cards:
        - type: heading
          heading: "Мережа та акумулятор"
          icon: mdi:transmission-tower
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **🌐 Обмін із мережею**
            
            {% set value = states('sensor.rakurs_grid_power') %}
            ## {{ (value ~ ' кВт') if value not in ['unknown', 'unavailable', 'none', ''] else '—' }}
            
            Знак потужності уточнюється
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **🔋 Заряд акумулятора**
            
            {% set value = states('sensor.rakurs_battery_soc') %}
            ## {{ (value ~ ' %') if value not in ['unknown', 'unavailable', 'none', ''] else '—' }}
            
            State of charge
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **🔋 Потужність АКБ**
            
            {% set value = states('sensor.rakurs_battery_power') %}
            ## {{ (value ~ ' кВт') if value not in ['unknown', 'unavailable', 'none', ''] else '—' }}
            
            Напрямок уточнюється
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **🌡️ Температура інвертора**
            
            {% set value = states('sensor.rakurs_inverter_temperature') %}
            ## {{ (value ~ ' °C') if value not in ['unknown', 'unavailable', 'none', ''] else '—' }}
            
            Вимірювання з Deye
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Енергетичний баланс"
          icon: mdi:chart-sankey
        - type: picture
          image: /local/rakurs/energy-flow.svg?v=3
          grid_options:
            columns: 24
        - type: markdown
          grid_options:
            columns: 24
          text_only: true
          content: |-
            _Пунктирні стрілки означають можливі електричні зв'язки, а не виміряні потоки. Після перевірки регістрів Deye додамо реальні значення та напрямки енергії._
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Якість даних"
          icon: mdi:information-outline
        - type: markdown
          grid_options:
            columns: 24
          content: |-
            **Дані ще не надходять.** TCP-доступ Home Assistant → Teltonika підтверджено, але тип Modbus-шлюзу та карту регістрів Deye поки не перевірено.
            
            Усі показники **«—» означають відсутність вимірювання**, а не нульову генерацію чи споживання.
  - title: "Сонце"
    path: pv
    icon: mdi:solar-power
    show_icon_and_title: true
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Сонячна генерація"
          icon: mdi:weather-sunny
        - type: markdown
          grid_options:
            columns: 24
          text_only: true
          content: |-
            # ПОВНИЙ РЕЄСТР ВИМІРЮВАНЬ
            
            Підготовлено поля за джерельним профілем **Deye P3**, але сумісність із **SG05LP3** та відповідність регістрів ще не перевірені. Значення «—» означає **немає даних**, а не нуль.
      - type: grid
        cards:
        - type: heading
          heading: "Поточна PV-генерація"
          icon: mdi:solar-panel-large
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **☀️ Потужність PV**
            
            {% set a=states('sensor.rakurs_pv_power') %}
            ## {{ (a ~ ' кВт') if a not in ['unknown','unavailable','none',''] else '—' }}
            
            _Лише реальні вимірювання_
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **☀️ Виробіток за добу**
            
            {% set a=states('sensor.rakurs_pv_energy_today') %}
            ## {{ (a ~ ' кВт·год') if a not in ['unknown','unavailable','none',''] else '—' }}
            
            _Лише реальні вимірювання_
      - type: grid
        cards:
        - type: heading
          heading: "PV1 та PV2"
          icon: mdi:solar-panel
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            {% macro value(id,unit='') -%}
            {%- set raw=states('sensor.rakurs_' ~ id) -%}
            {{ raw ~ (' ' ~ unit if unit else '') if raw not in ['unknown','unavailable','none',''] else '—' }}
            {%- endmacro %}
            **PV1**
            
            | Показник | Значення |
            |:--|--:|
            | PV1 — потужність | {{ value('pv1_power', 'кВт') }} |
            | PV1 — напруга | {{ value('pv1_voltage', 'В') }} |
            | PV1 — струм | {{ value('pv1_current', 'А') }} |
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            {% macro value(id,unit='') -%}
            {%- set raw=states('sensor.rakurs_' ~ id) -%}
            {{ raw ~ (' ' ~ unit if unit else '') if raw not in ['unknown','unavailable','none',''] else '—' }}
            {%- endmacro %}
            **PV2**
            
            | Показник | Значення |
            |:--|--:|
            | PV2 — потужність | {{ value('pv2_power', 'кВт') }} |
            | PV2 — напруга | {{ value('pv2_voltage', 'В') }} |
            | PV2 — струм | {{ value('pv2_current', 'А') }} |
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Облік та температури"
          icon: mdi:counter
        - type: markdown
          grid_options:
            columns: 24
          content: |-
            {% macro value(id,unit='') -%}
            {%- set raw=states('sensor.rakurs_' ~ id) -%}
            {{ raw ~ (' ' ~ unit if unit else '') if raw not in ['unknown','unavailable','none',''] else '—' }}
            {%- endmacro %}
            **Накопичення та DC**
            
            | Показник | Значення |
            |:--|--:|
            | Сумарна потужність PV | {{ value('pv_power', 'кВт') }} |
            | Виробіток за добу | {{ value('pv_energy_today', 'кВт·год') }} |
            | Виробіток за весь час | {{ value('pv_energy_total', 'кВт·год') }} |
            | Температура DC | {{ value('dc_temperature', '°C') }} |
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Підтвердження вимірів"
          icon: mdi:information-outline
        - type: markdown
          grid_options:
            columns: 24
          content: |-
            Трактування **PV1/PV2** як входів/стрінгів або MPPT потребує перевірки саме на Deye SG05LP3. Поки що жодне значення не генерується з інших сенсорів.
  - title: "Акумулятор"
    path: battery
    icon: mdi:battery-high
    show_icon_and_title: true
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      - type: grid
        cards:
        - type: heading
          heading: "Основні показники АКБ"
          icon: mdi:battery-charging
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **🔋 SOC**
            
            {% set a=states('sensor.rakurs_battery_soc') %}
            ## {{ (a ~ ' %') if a not in ['unknown','unavailable','none',''] else '—' }}
            
            _Лише реальні вимірювання_
        - type: markdown
          grid_options:
            columns: 6
          content: |-
            **⚡ Потужність АКБ**
            
            {% set a=states('sensor.rakurs_battery_power') %}
            ## {{ (a ~ ' кВт') if a not in ['unknown','unavailable','none',''] else '—' }}
            
            _Лише реальні вимірювання_
      - type: grid
        cards:
        - type: heading
          heading: "Електричні параметри"
          icon: mdi:current-dc
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            {% macro value(id,unit='') -%}
            {%- set raw=states('sensor.rakurs_' ~ id) -%}
            {{ raw ~ (' ' ~ unit if unit else '') if raw not in ['unknown','unavailable','none',''] else '—' }}
            {%- endmacro %}
            **АКБ: електричні й температурні**
            
            | Показник | Значення |
            |:--|--:|
            | Напруга АКБ | {{ value('battery_voltage', 'В') }} |
            | Струм АКБ | {{ value('battery_current', 'А') }} |
            | Потужність АКБ | {{ value('battery_power', 'кВт') }} |
            | Температура АКБ | {{ value('battery_temperature', '°C') }} |
            | Ємність АКБ | {{ value('battery_capacity', 'А·год') }} |
            | Стан АКБ | {{ value('battery_state', '') }} |
            | Уточнена ємність АКБ | {{ value('battery_corrected_capacity', 'А·год') }} |
      - type: grid
        cards:
        - type: heading
          heading: "Енергія та цикли"
          icon: mdi:counter
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            {% macro value(id,unit='') -%}
            {%- set raw=states('sensor.rakurs_' ~ id) -%}
            {{ raw ~ (' ' ~ unit if unit else '') if raw not in ['unknown','unavailable','none',''] else '—' }}
            {%- endmacro %}
            **Заряд, розряд і цикли**
            
            | Показник | Значення |
            |:--|--:|
            | Заряд за добу | {{ value('battery_charge_today', 'кВт·год') }} |
            | Розряд за добу | {{ value('battery_discharge_today', 'кВт·год') }} |
            | Сумарний заряд | {{ value('battery_charge_total', 'кВт·год') }} |
            | Сумарний розряд | {{ value('battery_discharge_total', 'кВт·год') }} |
            | Цикли за добу | {{ value('battery_cycles_today', '') }} |
            | Загальна кількість циклів | {{ value('battery_cycles_total', '') }} |
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Дані BMS (за підтримки)"
          icon: mdi:chip
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            {% macro value(id,unit='') -%}
            {%- set raw=states('sensor.rakurs_' ~ id) -%}
            {{ raw ~ (' ' ~ unit if unit else '') if raw not in ['unknown','unavailable','none',''] else '—' }}
            {%- endmacro %}
            **BMS — телеметрія · 1**
            
            | Показник | Значення |
            |:--|--:|
            | BMS — SOC | {{ value('bms_soc', '%') }} |
            | BMS — напруга | {{ value('bms_voltage', 'В') }} |
            | BMS — струм | {{ value('bms_current', 'А') }} |
            | Допустима напруга заряду | {{ value('bms_charge_voltage', 'В') }} |
            | Допустима напруга розряду | {{ value('bms_discharge_voltage', 'В') }} |
            | BMS — поточний струм заряду | {{ value('bms_charge_current', 'А') }} |
            
            _Дані з'являться лише за наявності відповідного обладнання._
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            {% macro value(id,unit='') -%}
            {%- set raw=states('sensor.rakurs_' ~ id) -%}
            {{ raw ~ (' ' ~ unit if unit else '') if raw not in ['unknown','unavailable','none',''] else '—' }}
            {%- endmacro %}
            **BMS — телеметрія · 2**
            
            | Показник | Значення |
            |:--|--:|
            | BMS — поточний струм розряду | {{ value('bms_discharge_current', 'А') }} |
            | BMS — макс. струм заряду | {{ value('bms_max_charge_current', 'А') }} |
            | BMS — макс. струм розряду | {{ value('bms_max_discharge_current', 'А') }} |
            | Тривога АКБ | {{ value('battery_alarm', '') }} |
            | Помилка АКБ | {{ value('battery_fault', '') }} |
            | Тип BMS | {{ value('battery_bms_type', '') }} |
            
            _Дані з'являться лише за наявності відповідного обладнання._
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "BMS: модулі 1–20"
          icon: mdi:layers
        - type: markdown
          grid_options:
            columns: 24
          content: |-
            **Опційна телеметрія батарейних модулів 1–20.** Ці групи присутні в референсному профілі, але їх фактичну наявність, кількість і тип BMS на об'єкті ще не підтверджено. Відсутні модулі не створюють аварії.
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Модуль BMS 1"
          icon: mdi:battery-outline
        - type: markdown
          grid_options:
            columns: 12
          content: |-
