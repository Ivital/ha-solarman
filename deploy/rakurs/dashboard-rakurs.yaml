  - title: "Історія"
    path: history
    icon: mdi:chart-line
    show_icon_and_title: true
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Аналітика вимірювань"
          icon: mdi:chart-areaspline
        - type: markdown
          grid_options:
            columns: 24
          text_only: true
          content: |-
            # Історія та аналітика
            
            Після надходження перевіреної телеметрії тут з’являться графіки потужності, енергії та заряду АКБ. Дані з минулих періодів не підставляються штучно.
            
            **Стан: очікування реальних часових рядів.**
      - type: grid
        cards:
        - type: heading
          heading: "Доба"
          icon: mdi:calendar-today
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            ### Потужність та енергія
            
            **Планові ряди:** PV, мережа, навантаження, потужність АКБ.
            
            **Період:** доба / погодинний аналіз.
            
            _Графік з’явиться після надходження вимірювань._
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            ### Добовий енергобаланс
            
            {% set a=states('sensor.rakurs_pv_energy_today') %}
            {% set b=states('sensor.rakurs_load_energy_today') %}
            | Показник | кВт·год |
            |:--|--:|
            | Генерація | {{ a if a not in ['unknown', 'unavailable', 'none', ''] else '—' }} |
            | Споживання | {{ b if b not in ['unknown', 'unavailable', 'none', ''] else '—' }} |
            
            _Дані лише з підтверджених сутностей._
      - type: grid
        cards:
        - type: heading
          heading: "Місяць та архів"
          icon: mdi:calendar-month
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            ### Порівняння періодів
            
            Денна й місячна генерація, споживання, імпорт/експорт мережі та самоспоживання.
            
            _Розрахунки будуть доступні після підтвердження накопичувальних лічильників енергії._
        - type: markdown
          grid_options:
            columns: 12
          content: |-
            ### Якість даних
            
            **Контроль надходження:** доступність пристрою, пропуски опитувань, коректність часових міток.
            
            **Архів:** зберігання реальної телеметрії Home Assistant.
            
            _Статистичні підсумки поки не формуються._
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Реальні графіки (з'являться після підключення)"
          icon: mdi:chart-line
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.rakurs_pv_power
              state_not: unknown
            - condition: state
              entity: sensor.rakurs_pv_power
              state_not: unavailable
          card:
            type: history-graph
            title: "Потужності: PV, мережа, навантаження"
            hours_to_show: 24
            entities:
                - sensor.rakurs_pv_power
                - sensor.rakurs_grid_power
                - sensor.rakurs_load_power
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.rakurs_battery_soc
              state_not: unknown
            - condition: state
              entity: sensor.rakurs_battery_soc
              state_not: unavailable
          card:
            type: history-graph
            title: "Заряд і електричні параметри АКБ"
            hours_to_show: 24
            entities:
                - sensor.rakurs_battery_soc
                - sensor.rakurs_battery_voltage
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.rakurs_inverter_temperature
              state_not: unknown
            - condition: state
              entity: sensor.rakurs_inverter_temperature
              state_not: unavailable
          card:
            type: history-graph
            title: "Температура інвертора та батареї"
            hours_to_show: 24
            entities:
                - sensor.rakurs_inverter_temperature
                - sensor.rakurs_battery_temperature
