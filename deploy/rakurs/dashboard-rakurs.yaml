            **Модуль 2: діагностика**
            
            | Показник | Значення |
            |:--|--:|
            | Модуль 2: Тривога | {{ value('bms_2_alarm', '') }} |
            | Модуль 2: Помилка | {{ value('bms_2_fault', '') }} |
            | Модуль 2: Макс. напруга комірки | {{ value('bms_2_max_cell_voltage', 'В') }} |
            | Модуль 2: Мін. напруга комірки | {{ value('bms_2_min_cell_voltage', 'В') }} |
            | Модуль 2: Цикли | {{ value('bms_2_cycles', '') }} |
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Модуль BMS 3"
          icon: mdi:battery-outline
        - type: markdown
          grid_options:
