            {%- endmacro %}
            **Модуль 1: діагностика**
            
            | Показник | Значення |
            |:--|--:|
            | Модуль 1: Тривога | {{ value('bms_1_alarm', '') }} |
            | Модуль 1: Помилка | {{ value('bms_1_fault', '') }} |
            | Модуль 1: Макс. напруга комірки | {{ value('bms_1_max_cell_voltage', 'В') }} |
            | Модуль 1: Мін. напруга комірки | {{ value('bms_1_min_cell_voltage', 'В') }} |
            | Модуль 1: Цикли | {{ value('bms_1_cycles', '') }} |
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: "Модуль BMS 2"
          icon: mdi:battery-outline
        - type: markdown
          grid_options:
