# TEMPORARY RAKURS MAINTENANCE; no HA or standalone backend.
# Replaced by nginx-standalone.conf after independent login is ready.
server {
    listen 443 ssl;
    server_name rakurs.zakryttya.org.ua;
    ssl_certificate /etc/letsencrypt/live/rakurs.zakryttya.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rakurs.zakryttya.org.ua/privkey.pem;
    ssl_session_tickets off;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    location / {
        default_type text/plain;
        return 503 "RAKURS_MAINTENANCE_UPGRADING\nRakurs: system is being upgraded.\n";
    }
}
server {
    listen 443 ssl;
    server_name www.rakurs.zakryttya.org.ua;
    ssl_certificate /etc/letsencrypt/live/rakurs.zakryttya.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rakurs.zakryttya.org.ua/privkey.pem;
    ssl_session_tickets off;
    return 301 https://rakurs.zakryttya.org.ua$request_uri;
}
