# RAKURS standalone (MySQL-only) replacement of the HA backend.
# Install as the exact existing Rakurs HTTPS vhost after preflight.
server {
    listen 443 ssl;
    server_name rakurs.zakryttya.org.ua;

    ssl_certificate /etc/letsencrypt/live/rakurs.zakryttya.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rakurs.zakryttya.org.ua/privkey.pem;
    ssl_session_tickets off;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Never trust incoming user-provided forwarded address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_hide_header Server;
    }
}
server {
    listen 443 ssl;
    server_name www.rakurs.zakryttya.org.ua;
    ssl_certificate /etc/letsencrypt/live/rakurs.zakryttya.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rakurs.zakryttya.org.ua/privkey.pem;
    ssl_session_tickets off;
    return 301 https://rakurs.zakryttya.org.ua$request_uri;
}
