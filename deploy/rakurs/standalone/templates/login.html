<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Вхід — RAKURS</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/login.css">
  <link rel="stylesheet" href="/static/rakurs-pages-20261126.css?v=rakurs-ux2-20261126">
  <script defer src="/static/rakurs-page-theme-20261126.js?v=rakurs-ux2-20261126"></script>
</head>
<body class="auth-page" data-theme="light">
  <div class="auth-theme-wrap"><button id="page-theme-toggle" class="page-theme-toggle" type="button" aria-pressed="false">☾ Темна тема</button></div>
  <main class="auth-card">
    <div class="auth-brand"><img src="/static/rakurs-logo.png" width="54" height="44" alt="НВО Ракурс">
      <div><strong>RAKURS</strong><small>ЕНЕРГОМОНІТОРИНГ</small></div>
    </div>
    <h1>Вхід до системи</h1>
    <p class="auth-copy">Введіть облікові дані для доступу до моніторингу.</p>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    <form action="/login" method="post" autocomplete="on">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% if next_path %}<input type="hidden" name="next" value="{{ next_path }}">{% endif %}
      <label for="username">Користувач</label>
      <input id="username" name="username" type="text" required maxlength="64"
             autocomplete="username" autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required maxlength="512"
             autocomplete="current-password">
      <button class="auth-submit" type="submit">Увійти</button>
    </form>
    <p class="auth-foot">MySQL rakurs · Власна система без Home Assistant</p>
  </main>
</body>
</html>
