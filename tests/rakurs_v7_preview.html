<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rakurs V7 — ізольований візуальний тест</title>
<link rel="stylesheet" href="../deploy/rakurs/standalone/static/rakurs-v7.css">
<style>
html,body{margin:0;padding:0;min-height:100%;background:#f4f7fc}
body[data-theme="dark"]{background:#0b1625}
#test-label{margin:8px auto 3px;text-align:center;font:600 10px system-ui;
 color:#60748c;letter-spacing:.04em}
#test-stage{margin:auto;width:100%;max-width:1570px}
</style>
<script src="../deploy/rakurs/standalone/static/rakurs-v7-model.js"></script>
<script src="../deploy/rakurs/standalone/static/rakurs-v7.js"></script>
</head>
<body data-theme="light">
<p id="test-label">ЛИШЕ ДЛЯ БРАУЗЕРНОГО ТЕСТУ · ДЕМОНСТРАЦІЙНІ АРХІВНІ ДАНІ · НЕ ОНЛАЙН</p>
<main id="test-stage"></main>
<script>
(function(){
 const p=new URLSearchParams(location.search);
 const theme=p.get("theme")==="dark"?"dark":"light";
 document.body.setAttribute("data-theme",theme);
 const t="2026-11-25T00:16:18Z";
 const r=(value,unit="кВт")=>({value_decimal:value,unit,observed_at_utc:t});
 const d1={device_key:"fixture_deye_1",slot_no:1,values:{
  pv_power:r(5.1),load_power:r(6.4),grid_power:r(0),
  battery_power:r(-1.3),battery_soc:r(72,"%")
 }};
 const d2={device_key:"fixture_deye_2",slot_no:2,values:{
  pv_power:r(5.432),load_power:r(6.816),grid_power:r(0),
  battery_power:r(-1.385),battery_soc:r(73.8,"%")
 }};
 const scenario=p.get("scenario")||"archive";
 if(scenario==="empty"){d1.values={};d2.values={};}
 if(scenario==="zero"){d1.values.pv_power=r(0);d2.values.pv_power=r(0);}
 if(scenario==="discharge"){d1.values.battery_power=r(1.38);d2.values.battery_power=r(1.4);}
 if(scenario==="battery-idle"){d1.values.battery_power=r(0);d2.values.battery_power=r(0);}
 if(scenario==="battery-conflict"){d2.values.battery_power=r(1.4);}
 if(scenario==="partial"){delete d1.values.battery_soc;delete d2.values.grid_power;}
 const start=Date.parse("2026-11-24T00:00:00Z");
 const loader=async(device,key,hours)=>{
  if(scenario==="empty")return {points:[]};
  const n=hours>=168?44:hours>=72?32:24;
  const points=Array.from({length:n},(_,i)=>{
   const hour=i/(n-1)*hours;
   const sun=Math.max(0,Math.sin((i/(n-1))*Math.PI*4.2));
   let v=key==="pv_power"?(device==="fixture_deye_1"?5.1:5.43)*sun:
    key==="load_power"?2.7+1.9*Math.sin(i*.44):
    key==="battery_power"?-1.2+Math.sin(i*.32):
    key==="battery_soc"?72+5*Math.sin(i*.1):
    key==="grid_power"?.45*Math.sin(i*.3):null;
   return {value_decimal:v,unit:key==="battery_soc"?"%":"кВт",
    observed_at_utc:new Date(start+hour*3600000).toISOString()};
  });
  return {points};
 };
 const settings={devices:[d1,d2],selectedDeviceKey:d1.device_key,
  selectedSlotNo:1,status:{collector_active:false,physical_topology_verified:false,
   register_semantics_verified:false},historyLoader:loader,
  now:Date.parse("2026-11-26T00:00:00Z")};
 window.__v7Fixture={settings};
 window.RakursV7.render(document.getElementById("test-stage"),settings);
})();
</script>
</body>
</html>
